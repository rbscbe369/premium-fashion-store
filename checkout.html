<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ELEVATE</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .checkout-container { display: grid; grid-template-columns: 2fr 1fr; gap: 40px; margin-top: 40px; }
        .form-section { background: #fff; padding: 30px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .form-section h3 { margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .cart-summary { background: var(--neutral-light); padding: 30px; border-radius: 8px; height: fit-content; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .summary-total { font-size: 1.2rem; font-weight: 700; border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; }
        
        @media (max-width: 768px) { .checkout-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">ELEVATE.</a>
        </div>
    </header>

    <main class="container">
        <h1 class="mt-4">Checkout</h1>
        <div class="checkout-container">
            <div>
                <form id="checkout-form">
                    <div class="form-section">
                        <h3>Shipping Address</h3>
                        <div class="grid grid-cols-2">
                            <div class="form-group">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-input" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Address</label>
                            <input type="text" class="form-input" required>
                        </div>
                        <div class="grid grid-cols-3">
                            <div class="form-group">
                                <label class="form-label">City</label>
                                <input type="text" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">State</label>
                                <input type="text" class="form-input" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Zip Code</label>
                                <input type="text" class="form-input" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>Payment Method</h3>
                        <div class="form-group">
                            <label style="display:block; margin-bottom:10px;">
                                <input type="radio" name="payment" value="card" checked> Credit/Debit Card
                            </label>
                            <label style="display:block;">
                                <input type="radio" name="payment" value="cod"> Cash on Delivery
                            </label>
                        </div>
                        <div id="card-details">
                            <div class="form-group">
                                <label class="form-label">Card Number</label>
                                <input type="text" class="form-input" placeholder="0000 0000 0000 0000">
                            </div>
                            <div class="grid grid-cols-2">
                                <div class="form-group">
                                    <label class="form-label">Expiry Date</label>
                                    <input type="text" class="form-input" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">CVV</label>
                                    <input type="text" class="form-input" placeholder="123">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block" style="font-size: 1.1rem; padding: 15px;">Place Order</button>
                </form>
            </div>
            
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div id="checkout-items">Loading...</div>
                <div class="summary-row summary-total mt-4">
                    <span>Total</span>
                    <span id="checkout-total">$0.00</span>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await api.cart.get();
                if (res && res.success) {
                    if (res.data.length === 0) {
                        window.location.href = 'cart.html';
                        return;
                    }
                    let html = '';
                    let total = 0;
                    res.data.forEach(item => {
                        total += item.price * item.quantity;
                        html += `
                            <div class="summary-row" style="font-size:0.9rem;">
                                <span>${item.name} (x${item.quantity})</span>
                                <span>$${(item.price * item.quantity).toFixed(2)}</span>
                            </div>
                        `;
                    });
                    document.getElementById('checkout-items').innerHTML = html;
                    document.getElementById('checkout-total').textContent = `$${total.toFixed(2)}`;
                } else {
                    window.location.href = 'login.html';
                }
            } catch (e) {
                console.error(e);
            }
        });

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            // Show loading state
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Processing...';
            btn.disabled = true;

            const res = await api.orders.create();
            if (res && res.success) {
                alert('Order placed successfully! Order ID: ' + res.order_id);
                window.location.href = 'index.html';
            } else {
                alert(res.error || 'Failed to place order');
                btn.textContent = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
