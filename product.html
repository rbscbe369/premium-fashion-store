<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | ELEVATE</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .product-detail-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            margin-top: 40px;
        }
        .product-gallery img {
            width: 100%;
            border-radius: 8px;
            background: var(--neutral-light);
        }
        .product-info-section h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .product-price { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; }
        .product-desc { color: var(--text-muted); margin-bottom: 30px; font-size: 1.1rem; }
        
        .size-selector, .quantity-selector { margin-bottom: 25px; }
        .size-selector h4, .quantity-selector h4 { margin-bottom: 10px; }
        
        .size-btn {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            background: none;
            cursor: pointer;
            margin-right: 10px;
            border-radius: 4px;
        }
        .size-btn.active { border-color: var(--primary-color); background: var(--primary-color); color: white; }
        
        .action-buttons { display: flex; gap: 15px; margin-top: 30px; }
        .action-buttons .btn { flex: 1; }

        @media (max-width: 768px) {
            .product-detail-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">ELEVATE.</a>
            <nav class="nav-links">
                <a href="products.html">Shop All</a>
            </nav>
            <div class="nav-icons">
                <a href="cart.html">Cart</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="product-content" class="product-detail-container">
            Loading...
        </div>
    </main>

    <!-- Try On Modal -->
    <div class="modal-overlay" id="tryon-modal">
        <div class="modal-content" style="max-width: 800px; width: 90%;">
            <button class="modal-close" onclick="closeTryOnModal()">&times;</button>
            <h2 class="mb-4 text-center">Virtual Try-On</h2>
            
            <div class="grid grid-cols-2" id="tryon-setup">
                <div>
                    <h4>1. Upload Your Photo</h4>
                    <p class="text-muted" style="font-size:0.9rem; margin-bottom:15px;">Clear, full-body shots work best. Max 10MB.</p>
                    <div style="border: 2px dashed var(--border-color); padding: 40px 20px; text-align: center; border-radius: 8px; cursor: pointer;" onclick="document.getElementById('user_image').click()">
                        <p id="upload-text">Click to upload or drag & drop</p>
                        <input type="file" id="user_image" accept="image/jpeg, image/png, image/webp" style="display:none;" onchange="previewUpload(event)">
                    </div>
                    <img id="upload-preview" src="" style="display:none; width:100%; margin-top:15px; border-radius:8px;">
                </div>
                <div>
                    <h4>2. Generate Result</h4>
                    <p class="text-muted" style="font-size:0.9rem; margin-bottom:15px;">Our AI engine will simulate the outfit on you.</p>
                    <button class="btn btn-primary btn-block" id="btn-generate" onclick="generateTryOn()" disabled>Generate Try-On</button>
                </div>
            </div>

            <div id="tryon-loading" style="display:none; padding: 40px 0; text-align:center;">
                <h4>Creating your virtual try-on...</h4>
                <p class="text-muted">Please wait a few moments.</p>
                <div style="margin-top:20px; border: 4px solid #f3f3f3; border-top: 4px solid #000; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
            </div>

            <div id="tryon-result" style="display:none;">
                <div class="grid grid-cols-2">
                    <div>
                        <h4 class="text-center mb-2">Before</h4>
                        <img id="result-before" src="" style="width:100%; border-radius:8px;">
                    </div>
                    <div>
                        <h4 class="text-center mb-2">After</h4>
                        <img id="result-after" src="" style="width:100%; border-radius:8px;">
                    </div>
                </div>
                <div class="action-buttons text-center mt-4">
                    <button class="btn btn-outline" onclick="closeTryOnModal()">Close</button>
                    <button class="btn btn-primary" onclick="addToCart()">Add Product to Cart</button>
                </div>
            </div>
        </div>
    </div>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>

    <script src="assets/js/api.js"></script>
    <script>
        let currentProduct = null;
        let selectedQuantity = 1;

        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            
            if (!id) {
                document.getElementById('product-content').innerHTML = '<p>Product not found.</p>';
                return;
            }

            try {
                const response = await api.products.getSingle(id);
                if (response && response.success) {
                    currentProduct = response.data;
                    renderProduct(currentProduct);
                } else {
                    document.getElementById('product-content').innerHTML = '<p>Product not found.</p>';
                }
            } catch (e) {
                console.error(e);
            }
        });

        function renderProduct(product) {
            const imgUrl = product.image;
            document.title = `${product.name} | ELEVATE`;
            
            const html = `
                <div class="product-gallery">
                    <img src="${imgUrl}" alt="${product.name}">
                </div>
                <div class="product-info-section">
                    <div style="color:var(--text-muted); text-transform:uppercase; font-size:0.9rem; margin-bottom:10px;">${product.category}</div>
                    <h1>${product.name}</h1>
                    <div class="product-price">$${parseFloat(product.price).toFixed(2)}</div>
                    <p class="product-desc">${product.description}</p>
                    
                    <div class="size-selector">
                        <h4>Size</h4>
                        <button class="size-btn active">S</button>
                        <button class="size-btn">M</button>
                        <button class="size-btn">L</button>
                        <button class="size-btn">XL</button>
                    </div>

                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="addToCart()">Add to Cart</button>
                        <button class="btn btn-accent" onclick="openTryOnModal()">Virtual Try-On</button>
                    </div>
                </div>
            `;
            document.getElementById('product-content').innerHTML = html;
        }

        async function addToCart() {
            if (!currentProduct) return;
            const res = await api.cart.add({ product_id: currentProduct.id, quantity: selectedQuantity });
            if (res && res.success) {
                alert('Added to cart!');
            } else {
                alert(res.error || 'Failed to add to cart. Are you logged in?');
                if (res.error && res.error.includes('login')) {
                    window.location.href = 'login.html';
                }
            }
        }

        let uploadedFile = null;
        let pollInterval = null;

        function openTryOnModal() {
            if (!currentProduct) return;
            document.getElementById('tryon-modal').classList.add('active');
            resetTryOnModal();
        }

        function closeTryOnModal() {
            document.getElementById('tryon-modal').classList.remove('active');
            if (pollInterval) clearInterval(pollInterval);
        }

        function previewUpload(event) {
            const file = event.target.files[0];
            if (file) {
                uploadedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('upload-preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById('btn-generate').disabled = false;
                    document.getElementById('upload-text').innerText = file.name;
                }
                reader.readAsDataURL(file);
            }
        }

        async function generateTryOn() {
            if (!uploadedFile || !currentProduct) return;

            // Update UI State
            document.getElementById('tryon-setup').style.display = 'none';
            document.getElementById('tryon-loading').style.display = 'block';

            const formData = new FormData();
            formData.append('user_image', uploadedFile);
            formData.append('product_id', currentProduct.id);

            const res = await api.tryon.upload(formData);
            
            if (res && res.success) {
                pollStatus(res.request_id);
            } else {
                alert(res.error || 'Failed to start try-on processing.');
                resetTryOnModal();
            }
        }

        function pollStatus(requestId) {
            pollInterval = setInterval(async () => {
                const res = await api.tryon.status(requestId);
                if (res && res.success) {
                    if (res.status === 'completed') {
                        clearInterval(pollInterval);
                        showResult(res.result_url);
                    } else if (res.status === 'failed') {
                        clearInterval(pollInterval);
                        alert('Virtual Try-On failed processing.');
                        resetTryOnModal();
                    }
                } else {
                    clearInterval(pollInterval);
                    alert('Error checking status.');
                    resetTryOnModal();
                }
            }, 3000); // poll every 3 seconds
        }

        function showResult(resultUrl) {
            document.getElementById('tryon-loading').style.display = 'none';
            document.getElementById('tryon-result').style.display = 'block';
            document.getElementById('result-before').src = document.getElementById('upload-preview').src;
            document.getElementById('result-after').src = resultUrl;
        }

        function resetTryOnModal() {
            document.getElementById('tryon-setup').style.display = 'grid';
            document.getElementById('tryon-loading').style.display = 'none';
            document.getElementById('tryon-result').style.display = 'none';
            document.getElementById('user_image').value = '';
            document.getElementById('upload-preview').style.display = 'none';
            document.getElementById('upload-text').innerText = 'Click to upload or drag & drop';
            document.getElementById('btn-generate').disabled = true;
            uploadedFile = null;
        }
    </script>
</body>
</html>
